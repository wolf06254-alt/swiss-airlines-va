<script>
(async()=>{
  try{
    const r=await fetch('/api/events');
    const data=await r.json();
    const box=document.getElementById('eventsList');
    if(!data.length){box.innerHTML='<div class="empty">Пока нет запланированных событий.</div>';return}
    box.innerHTML=data.map(e=>{
      const d=new Date(e.date||e.created_at);
      const day=d.getDate()||'—';
      const months=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
      const month=months[d.getMonth()]||'—';
      return `<div class="event-card">
        <div class="event-date"><span class="day">${day}</span><span class="month">${month}</span></div>
        <div class="event-body">
          <h3>${e.title||e.name||'Событие'}</h3>
          <p>${e.description||e.text||''}</p>
          ${e.type||e.category?`<span class="tag">${e.type||e.category}</span>`:''}
        </div>
      </div>`
    }).join('')
  }catch(e){document.getElementById('eventsList').innerHTML='<div class="empty">Не удалось загрузить события.</div>'}
})();
</script>
