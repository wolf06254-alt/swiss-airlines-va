<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swiss Airlines — Админ-панель</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#080808;color:#fff}a{color:inherit;text-decoration:none}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid rgba(255,255,255,.06);background:#0a0a0a}
.topbar-brand{font-size:14px;font-weight:800;letter-spacing:1px}
.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-user{font-size:12px;color:#888}
.topbar-logout{font-size:12px;color:#df0018;cursor:pointer}.topbar-logout:hover{color:#fff}
.main{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:220px;padding:24px 0;border-right:1px solid rgba(255,255,255,.06);background:#0a0a0a;flex-shrink:0}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 24px;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.sidebar-item:hover{color:#fff;background:rgba(255,255,255,.03)}.sidebar-item.active{color:#fff;border-left-color:#df0018;background:rgba(223,0,24,.05)}
.sidebar-item svg{width:18px;height:18px}
.content{flex:1;padding:32px;overflow-y:auto}
.section-title{font-size:22px;font-weight:800;margin-bottom:20px;letter-spacing:-.5px}
.red-btn{background:#df0018;border:0;color:#fff;padding:9px 20px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:background .2s}.red-btn:hover{background:#c90015}
.ghost-btn{background:transparent;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);padding:9px 20px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}.ghost-btn:hover{border-color:rgba(255,255,255,.25);color:#fff}
.add-form{background:#111;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:24px;margin-bottom:24px;display:none}.add-form.open{display:block}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;background:#0a0a0a;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:9px 12px;outline:none;font:inherit;transition:border-color .2s}
.form-group input:focus,.form-group textarea:focus{border-color:#df0018}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-row{display:flex;gap:10px;margin-top:14px}
.list-table{width:100%;border-collapse:collapse}
.list-table th{text-align:left;font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.list-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.03)}
.list-table tr:hover td{background:rgba(255,255,255,.02)}
.status-badge{display:inline-block;font-size:10px;padding:3px 10px;border-radius:10px;font-weight:600}
.status-badge.pending{background:rgba(234,179,8,.1);color:#eab308}
.status-badge.accepted{background:rgba(34,197,94,.1);color:#22c55e}
.status-badge.rejected{background:rgba(239,68,68,.1);color:#ef4444}
.del-btn{background:none;border:0;color:#555;cursor:pointer;font-size:14px;transition:color .2s}.del-btn:hover{color:#df0018}
.empty-msg{text-align:center;padding:40px;color:rgba(255,255,255,.3);font-size:13px}
.panel{display:none}.panel.active{display:block}
@media(max-width:768px){.sidebar{display:none}.content{padding:20px}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-brand">SWISS AIRLINES</div>
  <div class="topbar-right">
    <span class="topbar-user" id="topUser"></span>
    <span class="topbar-logout" onclick="fetch('/api/logout').then(()=>location='/login')">Выйти</span>
  </div>
</div>
<div class="main">
  <div class="sidebar">
    <div class="sidebar-item active" data-panel="events" onclick="switchPanel('events')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      События
    </div>
    <div class="sidebar-item" data-panel="history" onclick="switchPanel('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      История
    </div>
    <div class="sidebar-item" data-panel="apps" onclick="switchPanel('apps')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Анкеты
    </div>
  </div>
  <div class="content">
    <div class="panel active" id="panel-events">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div class="section-title">События</div>
        <button class="red-btn" onclick="toggleForm('evForm')">+ Добавить</button>
      </div>
      <div class="add-form" id="evForm">
        <div class="form-row">
          <div class="form-group"><label>Название</label><input id="evTitle"></div>
          <div class="form-group"><label>Дата</label><input type="date" id="evDate"></div>
        </div>
        <div class="form-group"><label>Описание</label><textarea id="evDesc"></textarea></div>
        <div class="form-group"><label>Категория</label><input id="evCat" placeholder="Групповой полёт"></div>
        <div class="btn-row">
          <button class="ghost-btn" onclick="toggleForm('evForm')">Отмена</button>
          <button class="red-btn" onclick="addEvent()">Сохранить</button>
        </div>
      </div>
      <div id="eventsTable"></div>
    </div>
    <div class="panel" id="panel-history">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div class="section-title">История</div>
        <button class="red-btn" onclick="toggleForm('histForm')">+ Добавить</button>
      </div>
      <div class="add-form" id="histForm">
        <div class="form-row">
          <div class="form-group"><label>Год</label><input id="histYear"></div>
          <div class="form-group"><label>Заголовок</label><input id="histTitle"></div>
        </div>
        <div class="form-group"><label>Описание</label><textarea id="histDesc"></textarea></div>
        <div class="btn-row">
          <button class="ghost-btn" onclick="toggleForm('histForm')">Отмена</button>
          <button class="red-btn" onclick="addHistory()">Сохранить</button>
        </div>
      </div>
      <div id="historyTable"></div>
    </div>
    <div class="panel" id="panel-apps">
      <div class="section-title">Анкеты</div>
      <div id="appsTable"></div>
    </div>
  </div>
</div>
<script>
(async()=>{try{const r=await fetch('/api/me');if(!r.ok)return location='/login';const u=await r.json();document.getElementById('topUser').textContent=u.username}catch(e){location='/login'}})();

function switchPanel(n){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.sidebar-item').forEach(s=>s.classList.remove('active'));document.getElementById('panel-'+n).classList.add('active');document.querySelector('[data-panel="'+n+'"]').classList.add('active');if(n==='events')loadEvents();if(n==='history')loadHistory();if(n==='apps')loadApps()}
function toggleForm(id){document.getElementById(id).classList.toggle('open')}

async function loadEvents(){const r=await fetch('/api/events');const d=await r.json();const b=document.getElementById('eventsTable');if(!d.length){b.innerHTML='<div class="empty-msg">Нет событий</div>';return}b.innerHTML='<table class="list-table"><tr><th>Дата</th><th>Название</th><th>Категория</th><th></th></tr>'+d.map(e=>'<tr><td>'+((e.date||'').slice(0,10))+'</td><td>'+(e.title||'')+'</td><td>'+(e.type||'')+'</td><td><button class="del-btn" onclick="delEvent('+e.id+')">✕</button></td></tr>').join('')+'</table>'}
async function addEvent(){const t=document.getElementById('evTitle'),d=document.getElementById('evDate'),desc=document.getElementById('evDesc'),c=document.getElementById('evCat');await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t.value,date:d.value,description:desc.value,type:c.value})});t.value=d.value=desc.value=c.value='';toggleForm('evForm');loadEvents()}
async function delEvent(id){await fetch('/api/events/'+id,{method:'DELETE'});loadEvents()}

async function loadHistory(){const r=await fetch('/api/history');const d=await r.json();const b=document.getElementById('historyTable');if(!d.length){b.innerHTML='<div class="empty-msg">Нет записей</div>';return}b.innerHTML='<table class="list-table"><tr><th>Год</th><th>Заголовок</th><th></th></tr>'+d.map(h=>'<tr><td>'+(h.year||'')+'</td><td>'+(h.title||'')+'</td><td><button class="del-btn" onclick="delHist('+h.id+')">✕</button></td></tr>').join('')+'</table>'}
async function addHistory(){const y=document.getElementById('histYear'),t=document.getElementById('histTitle'),d=document.getElementById('histDesc');await fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({year:y.value,title:t.value,description:d.value})});y.value=t.value=d.value='';toggleForm('histForm');loadHistory()}
async function delHist(id){await fetch('/api/history/'+id,{method:'DELETE'});loadHistory()}

async function loadApps(){const r=await fetch('/api/applications');const d=await r.json();const b=document.getElementById('appsTable');if(!d.length){b.innerHTML='<div class="empty-msg">Нет анкет</div>';return}const roles={pilot:'Пилот',cabin:'Бортпроводник',ground:'Наземный',tech:'Технический'};b.innerHTML='<table class="list-table"><tr><th>Ник</th><th>Роль</th><th>Возраст</th><th>Статус</th><th></th></tr>'+d.map(a=>'<tr><td>'+(a.roblox_username||'')+'</td><td>'+(roles[a.desired_role]||a.desired_role||'')+'</td><td>'+(a.age||'')+'</td><td><span class="status-badge '+(a.status||'pending')+'">'+(a.status==='accepted'?'Одобрено':a.status==='rejected'?'Отклонено':'Ожидает')+'</span></td><td><button class="ghost-btn" style="padding:4px 10px;font-size:10px;margin-right:4px" onclick="setApp('+a.id+',\'accepted\')">✓</button><button class="ghost-btn" style="padding:4px 10px;font-size:10px" onclick="setApp('+a.id+',\'rejected\')">✕</button></td></tr>').join('')+'</table>'}
async function setApp(id,s){await fetch('/api/applications/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});loadApps()}

loadEvents();
</script>
</body>
</html>
