<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swiss Airlines VA — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--red:#E30613;--red-glow:rgba(227,6,19,0.35);--bg:#0a0a0f;--bg2:#141428;--glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);--text:#f0f0f5;--text2:#a0a0b8;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:4px}
::-webkit-scrollbar-track{background:var(--bg2)}

.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);box-shadow:0 8px 32px rgba(0,0,0,0.25)}

.admin-layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--bg2);border-right:1px solid var(--glass-border);padding:24px;display:flex;flex-direction:column}
.sidebar .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.3rem;margin-bottom:32px;display:flex;align-items:center;gap:10px}
.sidebar .logo span{color:var(--red)}
.sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1}
.sidebar nav a{color:var(--text2);text-decoration:none;padding:10px 14px;border-radius:8px;font-size:0.9rem;font-weight:500;transition:all .2s;display:flex;align-items:center;gap:10px}
.sidebar nav a:hover,.sidebar nav a.active{color:var(--text);background:rgba(227,6,19,0.08)}
.sidebar nav a i{width:20px;text-align:center}
.sidebar .logout{margin-top:auto;background:transparent;border:1px solid var(--glass-border);color:var(--text2);padding:10px;border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
.sidebar .logout:hover{border-color:var(--red);color:var(--red)}

.main{padding:32px 40px;max-width:1200px;width:100%}
.main h1{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;margin-bottom:24px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.top-bar h2{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:600}
.top-bar .btn{background:var(--red);color:#fff;border:none;padding:8px 18px;border-radius:8px;font-weight:600;font-size:0.85rem;cursor:pointer;transition:all .2s}
.top-bar .btn:hover{box-shadow:0 0 20px var(--red-glow)}
.top-bar .btn.outline{background:transparent;border:1px solid var(--glass-border);color:var(--text);margin-left:8px}
.top-bar .btn.outline:hover{border-color:var(--red);color:var(--red)}

.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--glass-border)}
table{width:100%;border-collapse:collapse;font-size:0.9rem}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--glass-border)}
th{color:var(--text2);font-weight:600;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px;background:rgba(255,255,255,0.02)}
tr:hover td{background:rgba(255,255,255,0.02)}
.actions{display:flex;gap:8px}
.actions button{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px 8px;border-radius:4px;transition:all .2s}
.actions button:hover{color:var(--red);background:rgba(227,6,19,0.08)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:200;display:none;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal-box{background:var(--bg);border:1px solid var(--glass-border);border-radius:16px;padding:32px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.5);position:relative}
.modal-box h3{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;margin-bottom:20px}
.modal-box label{display:block;font-size:0.8rem;color:var(--text2);margin-bottom:4px;margin-top:12px}
.modal-box input,.modal-box textarea,.modal-box select{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:0.95rem;outline:none;transition:border .2s}
.modal-box input:focus,.modal-box textarea:focus,.modal-box select:focus{border-color:var(--red)}
.modal-box textarea{min-height:80px;resize:vertical}
.modal-box .btns{display:flex;gap:10px;margin-top:20px}
.modal-box .btns button{flex:1;padding:10px;border-radius:8px;font-weight:600;cursor:pointer;border:none}
.modal-box .btns .save{background:var(--red);color:#fff}
.modal-box .btns .cancel{background:transparent;border:1px solid var(--glass-border);color:var(--text2)}
.modal-box .close{position:absolute;top:16px;right:16px;color:var(--text2);background:none;border:none;font-size:1.2rem;cursor:pointer}

.login-screen{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--bg2);border:1px solid var(--glass-border);border-radius:16px;padding:40px;max-width:360px;width:90%;text-align:center}
.login-box .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.4rem;margin-bottom:8px}
.login-box .logo span{color:var(--red)}
.login-box p{color:var(--text2);font-size:0.85rem;margin-bottom:24px}
.login-box input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:0.95rem;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;background:var(--red);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:8px}
.login-box .err{color:var(--red);font-size:0.8rem;margin-top:8px}

@media(max-width:768px){
  .admin-layout{grid-template-columns:1fr}
  .sidebar{display:none}
  .main{padding:20px}
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="logo">Swiss <span>VA</span></div>
    <p>Admin access required</p>
    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">
    <button id="loginAction">Login</button>
    <div class="err" id="loginError"></div>
  </div>
</div>

<div class="admin-layout" id="adminLayout" style="display:none">
  <aside class="sidebar">
    <div class="logo"><i class="fa-solid fa-plane-up"></i> Swiss <span>VA</span></div>
    <nav>
      <a href="#" class="active" data-section="fleet"><i class="fa-solid fa-plane"></i> Fleet</a>
      <a href="#" data-section="routes"><i class="fa-solid fa-route"></i> Routes</a>
      <a href="#" data-section="events"><i class="fa-solid fa-calendar-days"></i> Events</a>
      <a href="#" data-section="timeline"><i class="fa-solid fa-clock-rotate-left"></i> Timeline</a>
      <a href="#" data-section="staff"><i class="fa-solid fa-users"></i> Staff</a>
    </nav>
    <button class="logout" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
  </aside>
  <main class="main">
    <h1>Admin Panel</h1>
    <div id="sectionContent"></div>
  </main>
</div>

<div class="modal" id="editModal">
  <div class="modal-box">
    <button class="close" id="closeEdit">×</button>
    <h3 id="editTitle">Edit</h3>
    <div id="editFields"></div>
    <div class="btns">
      <button class="save" id="saveBtn">Save</button>
      <button class="cancel" id="cancelBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
let currentSection='fleet',currentId=null;
const loginScreen=document.getElementById('loginScreen'),adminLayout=document.getElementById('adminLayout'),sectionContent=document.getElementById('sectionContent'),editModal=document.getElementById('editModal'),editFields=document.getElementById('editFields');

fetch('/api/me').then(r=>r.json()).then(d=>{if(d.loggedIn&&d.user.role==='admin'){loginScreen.style.display='none';adminLayout.style.display='grid';loadSection('fleet');}else{loginScreen.style.display='flex';adminLayout.style.display='none';}});

document.getElementById('loginAction').addEventListener('click',()=>{const u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(r=>r.json()).then(d=>{if(d.success){loginScreen.style.display='none';adminLayout.style.display='grid';loadSection('fleet');}else{document.getElementById('loginError').textContent='Invalid credentials';}});});
document.getElementById('logoutBtn').addEventListener('click',()=>{fetch('/api/logout',{method:'POST'}).then(()=>location.reload());});

document.querySelectorAll('.sidebar nav a').forEach(a=>{a.addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('.sidebar nav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');loadSection(a.dataset.section);});});

const fields={
  fleet:['aircraft','type','registration','capacity','range','status','image'],
  routes:['flight_number','origin','destination','distance','duration','aircraft_type','days','status'],
  events:['title','description','event_date','event_type','location','image'],
  timeline:['year','title','description','icon'],
  staff:['name','role','department','discord','image','bio']
};

function loadSection(section){
  currentSection=section;
  fetch('/api/'+section).then(r=>r.json()).then(data=>{
    let html='<div class="top-bar"><h2>'+section.charAt(0).toUpperCase()+section.slice(1)+'</h2><button class="btn" onclick="openAdd()">+ Add</button></div>';
    if(!data.length){html+='<p style="color:var(--text2)">No records yet.</p>';sectionContent.innerHTML=html;return;}
    html+='<div class="table-wrap"><table><thead><tr>';
    fields[section].forEach(f=>html+='<th>'+f.replace(/_/g,' ')+'</th>');
    html+='<th>Actions</th></tr></thead><tbody>';
    data.forEach(row=>{
      html+='<tr>';
      fields[section].forEach(f=>html+='<td>'+(row[f]||'')+'</td>');
      html+='<td class="actions"><button onclick="openEdit('+row.id+')"><i class="fa-solid fa-pen"></i></button><button onclick="deleteItem('+row.id+')"><i class="fa-solid fa-trash"></i></button></td></tr>';
    });
    html+='</tbody></table></div>';
    sectionContent.innerHTML=html;
  });
}

function openAdd(){currentId=null;document.getElementById('editTitle').textContent='Add '+currentSection;buildFields({});editModal.classList.add('show');}
function openEdit(id){currentId=id;fetch('/api/'+currentSection+'/'+id).then(r=>r.json()).then(row=>{document.getElementById('editTitle').textContent='Edit '+currentSection;buildFields(row);editModal.classList.add('show');});}
function buildFields(row){editFields.innerHTML='';fields[currentSection].forEach(f=>{const label=document.createElement('label');label.textContent=f.replace(/_/g,' ');const inp=document.createElement(f==='description'||f==='bio'?'textarea':'input');inp.className='field-'+f;inp.value=row[f]||'';editFields.appendChild(label);editFields.appendChild(inp);});}

document.getElementById('closeEdit').addEventListener('click',()=>editModal.classList.remove('show'));
document.getElementById('cancelBtn').addEventListener('click',()=>editModal.classList.remove('show'));
document.getElementById('saveBtn').addEventListener('click',()=>{
  const payload={};fields[currentSection].forEach(f=>{payload[f]=document.querySelector('.field-'+f).value;});
  const url=currentId?'/api/'+currentSection+'/'+currentId:'/api/'+currentSection;
  fetch(url,{method:currentId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json()).then(()=>{editModal.classList.remove('show');loadSection(currentSection);});
});
function deleteItem(id){if(!confirm('Delete this record?'))return;fetch('/api/'+currentSection+'/'+id,{method:'DELETE'}).then(()=>loadSection(currentSection));}
</script>
</body>
</html>
