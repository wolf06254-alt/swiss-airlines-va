<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWISS Airlines — Вход</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#121212;--bg2:#1a1a1a;--bg-card:#1e1e1e;--red:#E3000F;--red-dark:#b8000c;
  --white:#fff;--text2:#a0a0a0;--text3:#666;--border:rgba(255,255,255,0.08);
  --font:'Inter',sans-serif;--radius:12px;--radius-sm:8px;
}
body{font-family:var(--font);background:var(--bg);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}

.login-wrapper{width:100%;max-width:420px;padding:24px}

.login-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:48px 36px;position:relative;overflow:hidden}

.login-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--red)}

.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px;font-size:20px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase}

.login-logo .cross{width:32px;height:32px;position:relative}
.login-logo .cross::before,.login-logo .cross::after{content:'';position:absolute;background:var(--red);border-radius:2px}
.login-logo .cross::before{width:32px;height:8px;top:12px;left:0}
.login-logo .cross::after{width:8px;height:32px;top:0;left:12px}

.login-title{font-size:24px;font-weight:600;margin-bottom:8px}
.login-subtitle{font-size:14px;color:var(--text2);margin-bottom:32px}

.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.form-group input{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--white);font-family:var(--font);font-size:14px;outline:none;transition:border-color 0.3s}
.form-group input:focus{border-color:var(--red)}

.login-btn{width:100%;padding:14px;background:var(--red);color:var(--white);font-size:14px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;border-radius:var(--radius-sm);cursor:pointer;border:none;transition:all 0.3s;margin-top:8px}
.login-btn:hover{background:var(--red-dark)}
.login-btn:disabled{opacity:0.5;cursor:not-allowed}

.login-message{text-align:center;padding:12px;border-radius:var(--radius-sm);font-size:14px;margin-top:12px;display:none}
.login-message.error{display:block;background:rgba(227,0,15,0.1);border:1px solid rgba(227,0,15,0.3);color:var(--red)}
.login-message.success{display:block;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#22c55e}

.login-back{text-align:center;margin-top:20px;font-size:14px}
.login-back a{color:var(--red);text-decoration:none}
.login-back a:hover{text-decoration:underline}

@media(max-width:480px){.login-card{padding:32px 24px}}
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <div class="cross"></div>
      <span>SWISS</span>
    </div>
    <h1 class="login-title">Вход в панель</h1>
    <p class="login-subtitle">Доступ только для администраторов</p>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="username" required autocomplete="username" placeholder="Username">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="Password">
      </div>
      <button type="submit" class="login-btn">Войти</button>
      <div class="login-message" id="loginMsg"></div>
    </form>
    
    <div class="login-back"><a href="/">← На главную</a></div>
  </div>
</div>

<script>
async function handleLogin(e) {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('.login-btn');
  const msg = document.getElementById('loginMsg');
  
  btn.disabled = true;
  btn.textContent = 'Вход…';
  msg.className = 'login-message';
  msg.style.display = 'none';
  
  const body = {
    username: form.username.value,
    password: form.password.value
  };
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    
    if (data.success) {
      msg.className = 'login-message success';
      msg.style.display = 'block';
      msg.textContent = '✅ Вход выполнен! Перенаправление…';
      setTimeout(() => window.location.href = '/admin.html', 800);
    } else {
      msg.className = 'login-message error';
      msg.style.display = 'block';
      msg.textContent = '❌ ' + (data.error || 'Ошибка входа');
    }
  } catch (err) {
    msg.className = 'login-message error';
    msg.style.display = 'block';
    msg.textContent = '❌ Ошибка сети';
  }
  
  btn.disabled = false;
  btn.textContent = 'Войти';
}
</script>
</body>
</html>
