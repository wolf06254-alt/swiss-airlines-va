    <h1 class="section-title" data-i18n="login_title">Вход в админ-панель</h1>
    <p class="section-subtitle" data-i18n="login_subtitle">Только для администрации Swiss Airlines VA</p>

    <form id="loginForm" class="form-card">
      <div class="form-group">
        <label for="username" data-i18n="label_login">Логин</label>
        <input type="text" id="username" name="username" required />
      </div>
      <div class="form-group">
        <label for="password" data-i18n="label_pass">Пароль</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit" class="btn btn-primary w-100" data-i18n="btn_login">Войти</button>
    </form>
  </div>
</section>
