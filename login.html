<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swiss Airlines — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,sans-serif;background:#080808;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{width:100%;max-width:400px;background:#111;border:1px solid rgba(255,255,255,.07);border-radius:16px;overflow:hidden;position:relative}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#df0018}
.login-inner{padding:44px 36px}
.login-brand{text-align:center;margin-bottom:32px}
.login-brand .brand-name{font-size:20px;font-weight:800;letter-spacing:1px;margin-top:10px}
.login-brand .brand-sub{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:2px;margin-top:4px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.8px;font-weight:600;margin-bottom:8px}
.form-group input{width:100%;background:#0a0a0a;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:11px 14px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#df0018}
.login-btn{width:100%;background:#df0018;border:0;color:#fff;padding:12px;border-radius:24px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;margin-top:6px}
.login-btn:hover{background:#c90015}
.login-msg{margin-top:16px;padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.login-msg.err{display:block;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);color:#ef4444}
.login-back{text-align:center;margin-top:20px;font-size:13px;color:rgba(255,255,255,.4)}
.login-back a{color:#df0018;transition:color .2s}
.login-back a:hover{color:#fff}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-inner">
    <div class="login-brand">
      <svg viewBox="0 0 40 40" width="40" height="40" fill="none">
        <circle cx="20" cy="20" r="18" stroke="#df0018" stroke-width="2" fill="none"/>
        <path d="M14 20h12M20 14v12" stroke="#df0018" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="brand-name">SWISS AIRLINES</div>
      <div class="brand-sub">Панель управления</div>
    </div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="form-group"><label>Логин</label><input name="username" required placeholder="Логин" autocomplete="username"></div>
      <div class="form-group"><label>Пароль</label><input type="password" name="password" required placeholder="Пароль" autocomplete="current-password"></div>
      <button class="login-btn" type="submit">Войти</button>
    </form>
    <div class="login-msg" id="loginMsg"></div>
    <div class="login-back"><a href="/">← На главную</a></div>
  </div>
</div>
<script>
async function doLogin(e){
  e.preventDefault();
  const f=e.target;
  const data={username:f.username.value,password:f.password.value};
  const msg=document.getElementById('loginMsg');
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!r.ok){const j=await r.json();msg.className='login-msg err';msg.textContent=j.error||'Ошибка входа';return}
    window.location='/admin';
  }catch(err){msg.className='login-msg err';msg.textContent='Ошибка соединения'}
}
</script>
</body>
</html>
