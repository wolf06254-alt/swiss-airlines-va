<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="login-title">Вход — Swiss Airlines VA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --swiss-red: #e30613;
      --swiss-red-dark: #b0050f;
      --white: #ffffff;
      --black: #0a0a0a;
      --gray-100: #f5f5f5;
      --gray-200: #e5e5e5;
      --gray-300: #d4d4d4;
      --gray-500: #737373;
      --gray-700: #404040;
      --gray-900: #171717;
      --bg: var(--white);
      --text: var(--gray-900);
      --card: var(--white);
      --border: var(--gray-300);
      --transition: cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg: #0f0f0f;
      --text: #f0f0f0;
      --card: #1a1a1a;
      --border: #333333;
      --black: #f0f0f0;
      --gray-100: #1a1a1a;
      --gray-200: #2a2a2a;
      --gray-300: #444444;
      --gray-500: #888888;
      --gray-700: #bbbbbb;
      --gray-900: #f0f0f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.4s var(--transition), color 0.4s var(--transition);
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes stripeMove { from { background-position: 0 0; } to { background-position: 40px 0; } }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 48px;
      animation: fadeUp 0.8s ease-out;
      position: relative;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: repeating-linear-gradient(90deg, var(--swiss-red) 0, var(--swiss-red) 25px, transparent 25px, transparent 35px);
      background-size: 40px 4px;
      animation: stripeMove 2s linear infinite;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }
    .logo-cross {
      width: 44px; height: 44px;
      background: var(--swiss-red);
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 300;
      line-height: 1;
    }
    .logo-text {
      font-size: 15px; font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
    }

    .login-heading {
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .login-subheading {
      font-size: 13px;
      color: var(--gray-500);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--gray-500);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      background: var(--gray-100);
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      border-radius: 4px;
      transition: border-color 0.3s;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--swiss-red);
    }
    .form-input::placeholder {
      color: var(--gray-500);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--swiss-red);
      color: var(--white);
      border: none;
      font-family: inherit;
      font-size: 14px; font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.3s;
      border-radius: 4px;
      margin-top: 8px;
    }
    .login-btn:hover { background: var(--swiss-red-dark); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      display: none;
      color: var(--swiss-red);
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
    }
    .error-msg.visible { display: block; }

    .features {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--gray-200);
    }
    .feature-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--gray-500);
      margin-bottom: 12px;
    }
    .feature-icon { font-size: 16px; flex-shrink: 0; }

    .controls-row {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      justify-content: flex-end;
    }
    .ctrl-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--gray-500);
      padding: 6px 14px;
      font-family: inherit;
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.5px;
      border-radius: 4px;
    }
    .ctrl-btn:hover { color: var(--text); border-color: var(--text); }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
      .login-heading { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-row">
      <div class="logo-cross">+</div>
      <div class="logo-text">SWISS AIRLINES VA</div>
    </div>

    <h2 class="login-heading" data-i18n="login-heading">Панель администратора</h2>
    <p class="login-subheading" data-i18n="login-subheading">Войдите для управления анкетами и контентом</p>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" data-i18n="login-username-label">Логин</label>
        <input type="text" class="form-input" id="username" data-i18n-placeholder="login-username-ph" placeholder="Имя пользователя" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="login-password-label">Пароль</label>
        <input type="password" class="form-input" id="password" data-i18n-placeholder="login-password-ph" placeholder="••••••••">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <span data-i18n="login-btn">Войти</span>
      </button>
      <div class="error-msg" id="errorMsg" data-i18n="login-error">Неверный логин или пароль</div>
    </form>

    <div class="features">
      <div class="feature-row">
        <span class="feature-icon">📋</span>
        <span data-i18n="login-feat-1">Просмотр и управление анкетами</span>
      </div>
      <div class="feature-row">
        <span class="feature-icon">🛫</span>
        <span data-i18n="login-feat-2">Управление событиями и рейсами</span>
      </div>
      <div class="feature-row">
        <span class="feature-icon">📊</span>
        <span data-i18n="login-feat-3">Мониторинг статистики VA</span>
      </div>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn" id="langToggle" onclick="toggleLang()">EN</button>
      <button class="ctrl-btn" id="themeToggle" onclick="toggleTheme()">🌙</button>
    </div>
  </div>

  <script>
    const i18n = {
      ru: {
        'login-title': 'Вход — Swiss Airlines VA',
        'login-heading': 'Панель администратора',
        'login-subheading': 'Войдите для управления анкетами и контентом',
        'login-username-label': 'Логин',
        'login-username-ph': 'Имя пользователя',
        'login-password-label': 'Пароль',
        'login-password-ph': '••••••••',
        'login-btn': 'Войти',
        'login-btn-loading': 'Входим…',
        'login-error': 'Неверный логин или пароль',
        'login-session-expired': '⏳ Сессия истекла. Пожалуйста, войдите заново.',
        'login-not-admin': '🚫 Доступ запрещён. Требуются права администратора.',
        'login-auth-error': '⚠️ Ошибка авторизации. Попробуйте снова.',
        'login-feat-1': 'Просмотр и управление анкетами',
        'login-feat-2': 'Управление событиями и рейсами',
        'login-feat-3': 'Мониторинг статистики VA'
      },
      en: {
        'login-title': 'Login — Swiss Airlines VA',
        'login-heading': 'Admin Panel',
        'login-subheading': 'Sign in to manage applications and content',
        'login-username-label': 'Username',
        'login-username-ph': 'Enter username',
        'login-password-label': 'Password',
        'login-password-ph': '••••••••',
        'login-btn': 'Sign In',
        'login-btn-loading': 'Signing in…',
        'login-error': 'Invalid username or password',
        'login-session-expired': '⏳ Session expired. Please sign in again.',
        'login-not-admin': '🚫 Access denied. Admin rights required.',
        'login-auth-error': '⚠️ Authorization error. Please try again.',
        'login-feat-1': 'View and manage applications',
        'login-feat-2': 'Manage events and flights',
        'login-feat-3': 'Monitor VA statistics'
      }
    };

    function t(key) {
      const lang = document.documentElement.getAttribute('lang') || 'ru';
      return (i18n[lang] && i18n[lang][key]) || (i18n.ru[key]) || key;
    }

    function applyLang() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const val = t(key);
        if (val) el.textContent = val;
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        const val = t(key);
        if (val) el.placeholder = val;
      });
      document.title = t('login-title');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('swiss-theme', next);
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
    }
    function toggleLang() {
      const current = document.documentElement.getAttribute('lang') || 'ru';
      const next = current === 'ru' ? 'en' : 'ru';
      document.documentElement.setAttribute('lang', next);
      localStorage.setItem('swiss-lang', next);
      const btn = document.getElementById('langToggle');
      if (btn) btn.textContent = next === 'ru' ? 'EN' : 'RU';
      applyLang();
    }
    // Show session-expired / not-admin / error message based on ?reason= param
    (function() {
      const params = new URLSearchParams(window.location.search);
      const reason = params.get('reason');
      const errorEl = document.getElementById('errorMsg');
      if (reason && errorEl) {
        const keyMap = {
          'session_expired': 'login-session-expired',
          'not_auth': 'login-session-expired',
          'not_admin': 'login-not-admin',
          'error': 'login-auth-error'
        };
        const key = keyMap[reason] || 'login-session-expired';
        errorEl.textContent = t(key);
        errorEl.classList.add('visible');
        // Clean URL so message doesn't persist on refresh
        const cleanUrl = window.location.pathname;
        window.history.replaceState({}, '', cleanUrl);
      }
    })();

    const savedTheme = localStorage.getItem('swiss-theme');
    if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); document.getElementById('themeToggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙'; }
    const savedLang = localStorage.getItem('swiss-lang');
    if (savedLang) { document.documentElement.setAttribute('lang', savedLang); document.getElementById('langToggle').textContent = savedLang === 'ru' ? 'EN' : 'RU'; applyLang(); }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const btnSpan = btn.querySelector('span');
      const errorEl = document.getElementById('errorMsg');
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if (!u || !p) { errorEl.textContent = t('login-error'); errorEl.classList.add('visible'); return; }
      btn.disabled = true;
      btnSpan.textContent = t('login-btn-loading');
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            window.location.href = 'admin.html';
          }
        } else {
          errorEl.textContent = t('login-error');
          errorEl.classList.add('visible');
        }
      } catch (err) {
        errorEl.textContent = t('login-error');
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btnSpan.textContent = t('login-btn');
      }
    }
  </script>
</body>
</html>
