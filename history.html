<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swiss Airlines — История</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Inter,Helvetica,Arial,sans-serif;background:#080808;color:#fff;overflow-x:hidden}a{color:inherit;text-decoration:none}

.nav{position:fixed;z-index:200;top:0;left:0;right:0;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 60px;background:rgba(8,8,8,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-logo{width:200px}.nav-logo img{width:100%;display:block}
.nav-links{display:flex;gap:36px;list-style:none}.nav-links a{font-size:13px;font-weight:500;color:rgba(255,255,255,.7);padding:26px 0 18px;position:relative;transition:color .2s}.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:12px;height:2px;background:#df0018;transform:scaleX(0);transition:transform .25s}.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1)}.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-login{background:#df0018;border:0;border-radius:24px;color:#fff;padding:9px 22px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;transition:background .2s}.nav-login:hover{background:#c90015}
.burger{display:none;background:none;border:0;color:#fff;font-size:24px}

/* Page Hero */
.page-hero{position:relative;margin-top:70px;height:320px;overflow:hidden}
.page-hero-bg{position:absolute;inset:0;background:url('/assets/photos/card-history.png') center/cover no-repeat}
.page-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,8,.6) 0%,rgba(8,8,8,.9) 100%)}
.page-hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 80px}
.page-hero .hero-brand{font-size:13px;font-weight:700;color:#df0018;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.page-hero h1{font-size:42px;font-weight:800;letter-spacing:-1px}
.page-hero p{font-size:14px;color:rgba(255,255,255,.55);margin-top:10px;max-width:480px;line-height:1.6}

/* Timeline */
.timeline-section{padding:60px 80px 80px;max-width:900px}
.timeline{position:relative;padding-left:40px}
.timeline::before{content:"";position:absolute;left:15px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.08)}
.timeline-item{position:relative;padding:0 0 40px 32px}
.timeline-item:last-child{padding-bottom:0}
.timeline-dot{position:absolute;left:-32px;top:6px;width:14px;height:14px;border-radius:50%;background:#df0018;border:3px solid #080808;box-shadow:0 0 0 2px rgba(223,0,24,.3);z-index:2}
.timeline-year{font-size:14px;font-weight:800;color:#df0018;margin-bottom:6px}
.timeline-title{font-size:18px;font-weight:700;margin-bottom:8px}
.timeline-text{font-size:13px;color:rgba(255,255,255,.5);line-height:1.7}

.loading{text-align:center;padding:40px;color:rgba(255,255,255,.4);font-size:13px}
.empty{text-align:center;padding:60px;color:rgba(255,255,255,.35);font-size:14px}

/* Footer */
.footer{padding:28px 80px;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
.footer-brand{font-size:13px;font-weight:700;letter-spacing:1px}.footer-copy{font-size:10px;color:#555;margin-top:4px}
.footer-tagline{font-size:11px;color:rgba(255,255,255,.28);font-style:italic;letter-spacing:1px}
.footer-links{display:flex;gap:20px}.footer-links a{font-size:12px;color:rgba(255,255,255,.45);transition:color .2s}.footer-links a:hover{color:#fff}

@media(max-width:900px){
.nav{padding:0 24px}.nav-logo{width:155px}.nav-links{display:none}.nav-login{display:none}.burger{display:block}
.page-hero{height:240px}.page-hero-content{padding:0 30px}.page-hero h1{font-size:28px}
.timeline-section{padding:30px 24px 60px}
.timeline{padding-left:28px}
.footer{padding:24px 24px;flex-direction:column;gap:14px;align-items:flex-start}
}
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="/"><img src="/assets/photos/nav-logo.png" alt="SWISS"></a>
  <ul class="nav-links">
    <li><a href="/">Главная</a></li>
    <li><a href="/events">События</a></li>
    <li><a href="/history" class="active">История</a></li>
    <li><a href="/apply">Анкеты</a></li>
    <li><a href="/#contacts">Контакты</a></li>
  </ul>
  <a class="nav-login" href="/login">Войти</a>
  <button class="burger" onclick="document.querySelector('.nav-links').classList.toggle('show')">☰</button>
</nav>

<section class="page-hero">
  <div class="page-hero-bg"></div>
  <div class="page-hero-overlay"></div>
  <div class="page-hero-content">
    <div class="hero-brand">SWISS AIRLINES</div>
    <h1>История</h1>
    <p>Узнайте, как всё начиналось, и какой путь мы прошли вместе.</p>
  </div>
</section>

<div class="timeline-section">
  <div class="timeline" id="timeline">
    <div class="loading">Загрузка истории…</div>
  </div>
</div>

<footer class="footer">
  <div><div class="footer-brand">SWISS AIRLINES</div><div class="footer-copy">© 2026 Swiss Airlines VA · PTFS</div></div>
  <div class="footer-tagline">Together + further</div>
  <div class="footer-links"><a href="https://discord.gg/6YA8t7GJr" target="_blank">Discord</a><a href="/login">Войти</a></div>
</footer>

<script>
(async()=>{
  try{
    const r=await fetch('/api/history');
    const data=await r.json();
    const box=document.getElementById('timeline');
    if(!data.length){box.innerHTML='<div class="empty">Пока нет записей в истории.</div>';return}
    box.innerHTML=data.map(h=>`
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-year">${h.year||h.date||''}</div>
        <div class="timeline-title">${h.title||h.name||'Событие'}</div>
        <div class="timeline-text">${h.description||h.text||''}</div>
      </div>
    `).join('')
  }catch(e){document.getElementById('timeline').innerHTML='<div class="empty">Не удалось загрузить историю.</div>'}
})();
</script>
</body>
</html>
