<script>
(async()=>{
  try{
    const r=await fetch('/api/history');
    const data=await r.json();
    const box=document.getElementById('timeline');
    if(!data.length){box.innerHTML='<div class="empty">Пока нет записей в истории.</div>';return}
    box.innerHTML=data.map(h=>`
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-year">${h.year||h.date||''}</div>
        <div class="timeline-title">${h.title||h.name||'Событие'}</div>
        <div class="timeline-text">${h.description||h.text||''}</div>
      </div>
    `).join('')
  }catch(e){document.getElementById('timeline').innerHTML='<div class="empty">Не удалось загрузить историю.</div>'}
})();
</script>
