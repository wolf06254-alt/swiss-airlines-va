<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Техническое обслуживание | SWISS Airlines</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#121212;--red:#E3000F;--white:#fff;--text2:#a0a0a0;--text3:#666;--font:'Inter',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-font-smoothing:antialiased}
.maint-icon{width:64px;height:64px;position:relative;margin:0 auto 32px;animation:spin 3s linear infinite}
.maint-icon::before,.maint-icon::after{content:'';position:absolute;background:var(--red);border-radius:4px}
.maint-icon::before{width:64px;height:14px;top:25px;left:0}
.maint-icon::after{width:14px;height:64px;top:0;left:25px}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.maint-title{font-size:28px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:12px}
.maint-desc{font-size:16px;color:var(--text2);max-width:500px;margin:0 auto 12px}
.maint-eta{font-size:14px;color:var(--text3);margin-bottom:32px}
.maint-check{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,0.12);color:var(--text2);font-size:13px;font-weight:500;padding:10px 20px;border-radius:8px;cursor:pointer;transition:all 0.3s}
.maint-check:hover{border-color:var(--red);color:var(--white)}
.done-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;visibility:hidden;transition:all 0.5s}
.done-overlay.active{opacity:1;visibility:visible}
.done-check{width:80px;height:80px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:24px;animation:pop 0.5s ease}
.done-text{font-size:24px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase}
.done-sub{font-size:14px;color:var(--text2);margin-top:8px}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div>
  <div class="maint-icon"></div>
  <div class="maint-title" id="maintTitle">Техническое обслуживание</div>
  <p class="maint-desc" id="maintMsg">Мы обновляем сайт. Скоро вернёмся!</p>
  <p class="maint-eta" id="maintEta"></p>
  <button class="maint-check" onclick="checkStatus()">Проверить статус</button>
</div>
<div class="done-overlay" id="doneOverlay">
  <div class="done-check">✓</div>
  <div class="done-text">Мы вернулись!</div>
  <div class="done-sub">Перенаправление на главную…</div>
</div>
<script>
let pollInterval;
async function loadStatus() {
  try {
    const res = await fetch('/api/site-mode');
    const data = await res.json();
    document.getElementById('maintTitle').textContent = data.title || 'Техническое обслуживание';
    document.getElementById('maintMsg').textContent = data.message || 'Мы обновляем сайт. Скоро вернёмся!';
    document.getElementById('maintEta').textContent = data.eta ? 'Ожидаемое время: ' + data.eta : '';
    if (data.mode === 'live' && data.done) {
      document.getElementById('doneOverlay').classList.add('active');
      setTimeout(function(){ window.location.href = '/'; }, 2500);
      clearInterval(pollInterval);
    }
  } catch(e) {}
}
function checkStatus() { loadStatus(); }
loadStatus();
pollInterval = setInterval(loadStatus, 15000);
</script>
</body>
</html>
