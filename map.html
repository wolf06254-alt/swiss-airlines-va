<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта — Swiss Airlines VA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
<style>
  #map { width:100%; height:600px; border-radius:12px; border:1px solid #222; }
  .leaflet-popup-content-wrapper { background:#1a1a1a; color:#fff; border:1px solid #333; }
  .leaflet-popup-tip { background:#1a1a1a; }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<nav class="navbar">
  <div class="container nav-inner">
    <a href="index.html" class="logo"><div class="logo-icon">+</div> Swiss Airlines VA</a>
    <div class="nav-links">
      <a href="index.html" data-i18n="nav_home">Главная</a>
      <a href="fleet.html" data-i18n="nav_fleet">Флот</a>
      <a href="routes.html" data-i18n="nav_routes">Маршруты</a>
      <a href="map.html" class="active" data-i18n="nav_map">Карта</a>
      <a href="events.html" data-i18n="nav_events">События</a>
      <a href="history.html" data-i18n="nav_history">История</a>
      <a href="patent.html" data-i18n="nav_patent">Патент</a>
      <a href="apply.html" data-i18n="nav_apply">Анкета</a>
      <a href="contacts.html" data-i18n="nav_contacts">Контакты</a>
      <a href="login.html" data-i18n="nav_admin">Админ</a>
      <button class="lang-btn" id="langToggle">EN</button>
    </div>
  </div>
</nav>

<section class="section">
  <div class="container">
    <h1 class="section-title" data-i18n="map_title">Карта маршрутов</h1>
    <p class="section-subtitle" data-i18n="map_desc">Интерактивная карта всех направлений Swiss Airlines VA.</p>
    <div id="map"></div>
  </div>
</section>

<footer class="footer">
  <div class="container"><p data-i18n="footer">© 2026 Swiss Airlines VA. Все права защищены. PTFS.</p></div>
</footer>

<script src="i18n.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const map = L.map('map').setView([30, 10], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  try {
    const res = await fetch('/api/routes');
    const routes = await res.json();
    const seen = new Set();
    for (const r of routes) {
      if (!seen.has(r.origin_code)) {
        seen.add(r.origin_code);
        L.circleMarker([r.origin_lat, r.origin_lon], { radius: 6, color: '#D32F2F', fillColor: '#D32F2F', fillOpacity: 0.9 }).addTo(map)
          .bindPopup(`<strong>${r.origin}</strong> (${r.origin_code})`);
      }
      if (!seen.has(r.destination_code)) {
        seen.add(r.destination_code);
        L.circleMarker([r.dest_lat, r.dest_lon], { radius: 4, color: '#888', fillColor: '#888', fillOpacity: 0.7 }).addTo(map)
          .bindPopup(`<strong>${r.destination}</strong> (${r.destination_code})`);
      }
      L.polyline([[r.origin_lat, r.origin_lon], [r.dest_lat, r.dest_lon]], { color: '#D32F2F', weight: 1, opacity: 0.5 }).addTo(map);
    }
  } catch (e) { toast('Ошибка загрузки карты'); }
});
</script>
</body>
</html>
