<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Рейс отклонён | SWISS Airlines</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#121212;--red:#E3000F;--white:#fff;--text2:#a0a0a0;--font:'Inter',sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;-webkit-font-smoothing:antialiased}

.err-code{font-size:clamp(80px,15vw,160px);font-weight:700;line-height:1;letter-spacing:0.04em;color:var(--white);margin-bottom:8px}
.err-code span{color:var(--red)}
.err-title{font-size:20px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:12px}
.err-desc{font-size:15px;color:var(--text2);max-width:400px;margin:0 auto 32px}

.err-back{display:inline-flex;align-items:center;gap:8px;background:var(--red);color:var(--white);font-size:14px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:14px 28px;border-radius:8px;text-decoration:none;transition:background 0.3s}
.err-back:hover{background:#b8000c}
</style>
</head>
<body>
<div>
  <div class="err-code">4<span>0</span>4</div>
  <div class="err-title">Рейс отклонён</div>
  <p class="err-desc">Запрашиваемая страница не найдена. Возможно, она была перемещена или удалена.</p>
  <a href="/" class="err-back">← На главную</a>
</div>
</body>
</html>
