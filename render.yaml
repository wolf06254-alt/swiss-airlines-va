services:
  - type: web
    name: swiss-airlines-va
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: swiss-airlines-db
          property: connectionString

databases:
  - name: swiss-airlines-db
    databaseName: swiss_airlines
    plan: free
    ipAllowList: []