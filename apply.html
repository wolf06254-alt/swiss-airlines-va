<div class="form-section">
  <div class="form-card">
    <form id="applyForm" class="form-inner" onsubmit="submitApplication(event)">
      <div class="form-row">
        <div class="form-group"><label>Roblox никнейм</label><input name="roblox_username" required placeholder="Ваш никнейм в Roblox"></div>
        <div class="form-group"><label>Telegram</label><input name="telegram" required placeholder="@username"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Возраст</label><input type="number" name="age" required min="10" max="99" placeholder="Ваш возраст"></div>
        <div class="form-group"><label>Желаемая роль</label><select name="desired_role" required><option value="pilot">Пилот</option><option value="cabin">Бортпроводник</option><option value="ground">Наземный персонал</option><option value="tech">Технический персонал</option></select></div>
      </div>
      <div class="form-group"><label>Опыт</label><textarea name="experience" placeholder="Расскажите о вашем опыте..."></textarea></div>
      <div class="form-group"><label>Почему Swiss?</label><textarea name="why_swiss" placeholder="Почему хотите вступить именно в Swiss Airlines?"></textarea></div>
      <div class="form-actions">
        <a class="btn-ghost" href="/">Отмена</a>
        <button class="btn-red" type="submit">Подать анкету</button>
      </div>
    </form>
    <div class="form-msg" id="formMsg"></div>
  </div>
</div>

<script>
async function submitApplication(e){
  e.preventDefault();
  const f=e.target;
  const data=Object.fromEntries(new FormData(f).entries());
  const msg=document.getElementById('formMsg');
  try{
    const r=await fetch('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!r.ok)throw 0;
    msg.className='form-msg ok';
    msg.textContent='✅ Анкета успешно отправлена! Мы свяжемся с вами в ближайшее время.';
    f.reset();
  }catch(err){
    msg.className='form-msg err';
    msg.textContent='❌ Не удалось отправить анкету. Проверьте, что сервер запущен.';
  }
}
</script>
